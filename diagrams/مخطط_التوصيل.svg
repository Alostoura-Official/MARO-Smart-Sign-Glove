<rect x="45" y="160" width="330" height="245" class="box"/><text x="210" y="205" text-anchor="middle" class="title">5 حساسات Flex</text><text x="210" y="250" text-anchor="middle" class="sub">الإبهام والسبابة</text><text x="210" y="285" text-anchor="middle" class="sub">الوسطى والبنصر</text><text x="210" y="320" text-anchor="middle" class="sub">والخنصر</text><text x="210" y="365" text-anchor="middle" class="note">كل حساس مع مقاومة 10kΩ</text><path d="M375 280 H480" class="wire"/><text x="420" y="260" text-anchor="middle" class="note">ADC</text>

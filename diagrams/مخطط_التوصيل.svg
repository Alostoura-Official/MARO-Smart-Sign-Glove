<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs><style>text{font-family:Arial,sans-serif;fill:#10233f}.title{font-size:34px;font-weight:bold}.sub{font-size:22px}.box{fill:#f4f8ff;stroke:#2365a8;stroke-width:3;rx:18}.main{fill:#e8f3ff;stroke:#073b70;stroke-width:5;rx:24}.power{fill:#fff4e5;stroke:#bd6b00;stroke-width:3;rx:18}.wire{stroke:#16835c;stroke-width:5;fill:none}.bus{stroke:#2365a8;stroke-width:5;fill:none}.pwr{stroke:#c47b10;stroke-width:5;fill:none}.note{font-size:18px;fill:#45556b}</style></defs><rect width="1400" height="900" fill="#ffffff"/><text x="700" y="55" text-anchor="middle" class="title">مخطط توصيل القفاز الذكي - ESP32</text><text x="700" y="92" text-anchor="middle" class="note">رسم توضيحي عام — راجع أطراف وحداتك الفعلية قبل التوصيل</text>

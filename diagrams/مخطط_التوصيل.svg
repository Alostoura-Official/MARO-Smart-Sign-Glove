<rect x="1020" y="340" width="330" height="150" class="box"/><text x="1185" y="390" text-anchor="middle" class="title">OLED SSD1306</text><text x="1185" y="435" text-anchor="middle" class="sub">عرض اسم الإشارة</text><path d="M900 420 H1020" class="bus"/><text x="960" y="405" text-anchor="middle" class="note">I2C</text>
<rect x="1020" y="560" width="330" height="160" class="box"/><text x="1185" y="610" text-anchor="middle" class="title">DFPlayer Mini</text><text x="1185" y="655" text-anchor="middle" class="sub">بطاقة microSD + سماعة</text><text x="1185" y="690" text-anchor="middle" class="note">ملفات MP3 مرقمة</text><path d="M900 500 H960 V640 H1020" class="wire"/><text x="960" y="555" text-anchor="middle" class="note">UART2</text>
<rect x="45" y="570" width="330" height="160" class="power"/><text x="210" y="620" text-anchor="middle" class="title">منظومة الطاقة</text><text x="210" y="665" text-anchor="middle" class="sub">بطارية + TP4056 محمي</text><text x="210" y="700" text-anchor="middle" class="note">منظم/رافع جهد مناسب</text><path d="M375 650 H430 V520 H480" class="pwr"/><text x="420" y="635" text-anchor="middle" class="note">طاقة منظمة</text>

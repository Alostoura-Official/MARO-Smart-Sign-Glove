<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="" />
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable = no" />
    <meta name="theme-color" content="#6B6AB3">
    <meta property="og:title" content="محاكي إيماءات اليد" />
    <meta property="og:description" content="تجربة صغيرة تستخدم نظام الهياكل العظمية في Blender مع Three.js لتحريك يد بسيطة" />
    <title>محاكي إيماءات اليد</title>
  </head>
  <body>
    <canvas class="webgl"></canvas>

    <!-- شاشة التحميل -->
    <div id="loading-overlay">
      <div class="spinner"></div>
      <div id="loading-text">⏳ جاري تحميل النموذج...</div>
    </div>

    <!-- ============ شريط علوي ============ -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-title" id="app-title">🤚 محاكي إيماءات اليد</span>
      </div>
      <div class="topbar-right">
        <button id="back-btn" type="button" class="topbar-btn">↩️ رجوع</button>
        <button id="settings-toggle" type="button" class="topbar-btn">⚙️ الإعدادات</button>
        <button id="lang-toggle" type="button" class="topbar-btn">🌐 English</button>
        <button id="screenshot" type="button" class="topbar-btn topbar-btn-primary">💾 حفظ الصورة</button>
      </div>
    </header>

    <!-- لوحة الإعدادات -->
    <div id="pane"></div>

    <!-- أزرار الحركات -->
        <!-- أزرار الحركات -->
    <div class="poses">
      <!-- العمود الأيسر -->
      <div class="col-left">
        <button id="raised-hand"    type="button">✋ يد مرفوعة</button>
        <button id="raised-finger"  type="button">☝️ إصبع مرفوع</button>
        <button id="rock-on"        type="button">🤘 شارة الروك</button>
        <button id="peace"          type="button">✌️ علامة السلام</button>
        <button id="hang-loose"     type="button">🤙 شاكا</button>
        <button id="fu"             type="button">🖕 إصبع وسطى</button>
        <button id="vulcan-salute"  type="button">🖖 تحية فولكان</button>
        <button id="thumbs-up"      type="button">👍 ممتاز</button>
        <button id="thumbs-down"    type="button">👎 سيئ</button>
        <button id="ok-sign"        type="button">👌 حسناً</button>
      </div>

      <!-- العمود الأيمن -->
      <div class="col-right">
        <button id="pointing"       type="button">👉 إشارة</button>
        <button id="fist"           type="button">✊ قبضة</button>
        <button id="open-palm"      type="button">🖐️ كف مفتوح</button>
        <button id="call-me"        type="button">🤙 اتصل بي</button>
        <button id="three-fingers"  type="button">🖖 ثلاثة</button>
        <button id="i-love-you"     type="button">🤟 أحبك</button>
        <button id="crossed-fingers" type="button">🤞 متقاطعة</button>
        <button id="pinch"          type="button">🤏 قرصة</button>
        <button id="point-up"       type="button">👆 للأعلى</button>
        <button id="italian"        type="button">🤌 إيطالية</button>
        <button id="finger-heart"   type="button">🫰 قلب</button>
      </div>
    </div>

    <!-- التذييل -->
    <footer>
      <span id="created-by">صُنع بواسطة</span>
      <a href="#" target="_blank">الأسطورة</a>
    </footer>

    <script type="module" src="/main.js"></script>
  </body>
</html>
